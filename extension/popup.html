<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Crash Analysis</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="title">
          <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Crash Analysis
        </h1>
        <span class="badge">MVP</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Input Section -->
      <section class="input-section">
        <div class="section-header">
          <label for="stackTraceInput" class="label">Stack Trace</label>
          <button id="extractBtn" class="btn-secondary" title="Extract from current page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Extract
          </button>
        </div>
        <textarea 
          id="stackTraceInput" 
          class="textarea" 
          placeholder="Paste your stack trace here or click 'Extract' to capture from the current page...

Example:
Exception in thread &quot;main&quot; java.lang.NullPointerException
    at com.example.MyClass.processData(MyClass.java:45)
    at com.example.Service.handleRequest(Service.java:123)
    at com.example.Main.main(Main.java:15)"
          rows="10"
        ></textarea>
        <div class="char-count">
          <span id="charCount">0</span> characters
        </div>
      </section>

      <!-- Action Buttons -->
      <section class="action-section">
        <button id="analyzeBtn" class="btn-primary" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Analyze with AI
        </button>
        <button id="clearBtn" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Clear
        </button>
      </section>

      <!-- Status Section -->
      <section id="statusSection" class="status-section hidden">
        <div class="status-message">
          <div class="spinner"></div>
          <span id="statusText">Analyzing stack trace...</span>
        </div>
      </section>

      <!-- Results Section (placeholder for future) -->
      <section id="resultsSection" class="results-section hidden">
        <div class="section-header">
          <h2 class="section-title">Analysis Results</h2>
        </div>
        <div id="resultsContent" class="results-content">
          <!-- Results will be populated here -->
        </div>
      </section>

      <!-- Parsed Stack Info -->
      <section id="parsedSection" class="parsed-section hidden">
        <details>
          <summary class="parsed-summary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="9 18 15 12 9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Parsed Stack Trace (<span id="frameCount">0</span> frames)
          </summary>
          <div id="parsedContent" class="parsed-content">
            <!-- Parsed data will be shown here -->
          </div>
        </details>
      </section>

      <!-- Follow-up Question Section -->
      <section id="followUpSection" class="follow-up-section hidden">
        <div class="section-header">
          <label for="followUpInput" class="label">Ask Follow-up Question</label>
        </div>
        <div class="follow-up-input-group">
          <input 
            type="text" 
            id="followUpInput" 
            class="follow-up-input" 
            placeholder="e.g., What could cause this null pointer?"
          >
          <button id="askBtn" class="btn-ask">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Ask
          </button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <span class="footer-text">LabWeek 2026 Demo - Day 3</span>
        <a href="settings.html" class="footer-link">Settings</a>
      </div>
    </footer>
  </div>

  <script src="ai-service.js"></script>
  <script src="github-service.js"></script>
  <script src="popup.js"></script>
</body>
</html>
